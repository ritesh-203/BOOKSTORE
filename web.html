<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #ddd;
    }
  </style>
</head>

<body>

  <h2>Student Details</h2>

  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Age</th>
      <th>Course</th>
    </tr>

    <tr>
      <td>1</td>
      <td>Rahul</td>
      <td>20</td>
      <td>BCA</td>
    </tr>

    <tr>
      <td>2</td>
      <td>Priya</td>
      <td>21</td>
      <td>B.Tech</td>
    </tr>

    <tr>
      <td>3</td>
      <td>Amit</td>
      <td>19</td>
      <td>BBA</td>
    </tr>
  </table>

</body>
</html>
